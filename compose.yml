name: ru-polymarket
services:
  app:
    build: .
    ports:
      - "127.0.0.1:3101:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3101}
      DATABASE_PATH: /data/ishod.sqlite
      TRUST_PROXY: "true"
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
    volumes:
      - ishod-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  ishod-data:
